    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg076_split03" class="mx-auto w-full max-w-4xl px-8 py-8 max-sm:px-5"><div class="overflow-hidden border border-cyan-100 bg-cyan-50/95"><div class="bg-gradient-to-r from-teal-700 via-teal-500 to-teal-300 px-6 py-3 max-sm:px-4"><h1 class="adt-h3 font-bold text-white" data-id="pg077_n0029">Example 4.21</h1></div><div class="space-y-5 px-6 py-5 max-sm:px-4"><div class="adt-body text-stone-900 text-lg" data-id="pg077_n0030">Factorize <math><mrow><msup><mi>x</mi><mn class="tml-sml-pad">2</mn></msup><mo>−</mo><mn>81</mn></mrow></math>.</div><h4 class="adt-h4 font-bold text-teal-700" data-id="pg077_n0032">Solution</h4><p class="adt-body leading-relaxed text-stone-900 text-lg"><span data-id="pg077_n0034">Write <math><mrow><msup><mi>x</mi><mn class="tml-sml-pad">2</mn></msup><mo>−</mo><mn>81</mn></mrow></math> as a difference of two squares.</span> <span data-id="pg077_n0035">That is,</span></p><div class="adt-body pl-6 text-stone-900 max-sm:pl-3" data-id="pg077_n0036"><math><mrow><msup><mi>x</mi><mn class="tml-sml-pad">2</mn></msup><mo>−</mo><mn>81</mn><mo>=</mo><msup><mi>x</mi><mn class="tml-sml-pad">2</mn></msup><mo>−</mo><msup><mn>9</mn><mn>2</mn></msup></mrow></math></div><div class="adt-body pl-10 text-stone-900 max-sm:pl-6" data-id="pg077_n0037">= (x + 9)(x - 9)</div><p class="adt-body leading-relaxed text-stone-900 text-lg" data-id="pg077_n0039">Therefore, <math><mrow><msup><mi>x</mi><mn class="tml-sml-pad">2</mn></msup><mo>−</mo><mn>81</mn><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>x</mi><mo>+</mo><mn>9</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>x</mi><mo>−</mo><mn>9</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></math>.</p></div></div></section></div>
