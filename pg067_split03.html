    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg067_split03" class="mx-auto w-full max-w-5xl px-8 max-sm:px-5 py-8"><div class="rounded-3xl border-4 border-teal-300 bg-gradient-to-br from-cyan-50 via-white to-amber-50 p-6 shadow-lg space-y-5"><h1 class="adt-h3 font-bold text-teal-700" data-id="pg068_n0039">Example 4.3</h1><p class="adt-body text-stone-800 leading-relaxed text-lg"><span data-id="pg068_n0041">Given that <math><mrow><mi>x</mi><mo>∗</mo><mi>y</mi><mo>=</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>6</mn><mi>y</mi></mrow></math>, find the value of <math><mrow><mn>6</mn><mo>∗</mo><mn>4</mn></mrow></math>.</span></p><h4 class="adt-h4 font-bold text-orange-600" data-id="pg068_n0043">Solution</h4><div class="adt-body text-stone-800 leading-relaxed text-lg"><span data-id="pg068_n0045">Given <math><mrow><mi>x</mi><mo>∗</mo><mi>y</mi><mo>=</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>6</mn><mi>y</mi></mrow></math>. It follows that,</span></div><div class="space-y-2 rounded-2xl bg-white/80 p-4 ring-1 ring-teal-200"><div class="overflow-x-auto text-stone-900" data-id="pg068_n0046"><math><mrow><mn>6</mn><mo>∗</mo><mn>4</mn><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>4</mn><mo>×</mo><mn>6</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>+</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>6</mn><mo>×</mo><mn>4</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></math></div><div class="overflow-x-auto text-stone-900" data-id="pg068_n0047">= 24 + 24</div><div class="overflow-x-auto text-stone-900" data-id="pg068_n0048">= 48</div></div><p class="adt-body text-stone-800 leading-relaxed text-lg"><span data-id="pg068_n0049">Therefore, <math><mrow><mn>6</mn><mo>∗</mo><mn>4</mn><mo>=</mo><mn>48</mn></mrow></math>.</span></p></div></section></div>
