      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg095_split02" class="mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-5"><div class="space-y-6 rounded-3xl border-2 border-orange-200 bg-gradient-to-b from-amber-50 to-orange-50 p-6 shadow-sm"><div class="space-y-3"><h1 class="adt-h3 font-bold text-teal-800" data-id="pg096_n0067">Example 5.6</h1><p class="adt-body leading-relaxed text-stone-800"><span data-id="pg096_n0069">Simplify each of the following by using multiplication law of exponents:</span></p><div class="grid grid-cols-1 gap-3"><div class="rounded-2xl bg-white/80 p-4 shadow-sm"><div class="adt-body leading-relaxed text-stone-900 break-words text-lg" data-id="pg096_n0072">(a) <math><mrow><msup><mn>7</mn><mn>6</mn></msup><mo>×</mo><msup><mn>7</mn><mn>8</mn></msup></mrow></math></div></div><div class="rounded-2xl bg-white/80 p-4 shadow-sm"><div class="adt-body leading-relaxed text-stone-900 break-words text-lg" data-id="pg096_n0074">(b) <math><mrow><msup><mn>6</mn><mn>4</mn></msup><mo>×</mo><msup><mn>6</mn><mn>3</mn></msup><mo>×</mo><msup><mn>6</mn><mn>4</mn></msup></mrow></math></div></div><div class="rounded-2xl bg-white/80 p-4 shadow-sm"><div class="adt-body leading-relaxed text-stone-900 break-words text-lg" data-id="pg096_n0076">(c) <math><mrow><msup><mrow><mo fence="true" form="prefix" stretchy="true">(</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>5</mn><mn>9</mn></mfrac></mstyle><mo fence="true" form="postfix" stretchy="true">)</mo></mrow><mn>3</mn></msup><mo>×</mo><msup><mrow><mo fence="true" form="prefix" stretchy="true">(</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>5</mn><mn>9</mn></mfrac></mstyle><mo fence="true" form="postfix" stretchy="true">)</mo></mrow><mn>4</mn></msup></mrow></math></div></div><div class="rounded-2xl bg-white/80 p-4 shadow-sm"><div class="adt-body leading-relaxed text-stone-900 break-words text-lg" data-id="pg096_n0078">(d) <math><mrow><msup>
