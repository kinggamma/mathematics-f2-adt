<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container mx-auto opacity-0"><section data-section-type="boxed_text" data-section-id="pg069_split02" class="mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-5"><div class="overflow-hidden rounded-2xl border border-cyan-200 bg-cyan-50 shadow-sm"><div class="bg-gradient-to-r from-teal-600 to-cyan-400 px-6 py-4"><h1 class="adt-h3 font-bold text-white" data-id="pg070_n0036">Example 4.9</h1></div><div class="space-y-5 p-6 max-sm:p-5"><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg070_n0038">Given that <math><mrow><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></mrow></math>, make <math><mi>m</mi></math> the subject of the formula.</span></p><h3 class="adt-h3 font-bold text-teal-700" data-id="pg070_n0040">Solution</h3><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg070_n0042">Given the formula <math><mrow><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></mrow></math>. (i)</span></p><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg070_n0044">Subtract <math><mi>c</mi></math> from both sides of equation (i) to get, <math><mrow><mi>y</mi><mo>−</mo><mi>c</mi><mo>=</mo><mi>m</mi><mi>x</mi></mrow></math>. (ii)</span></p><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg070_n0046">Divide equation (ii) by <math><mi>x</mi></math> throughout to get, <math><mrow><mi>m</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>y</mi><mo>−</mo><mi>c</mi></mrow><mi>x</mi></mfrac></mstyle></mrow></math></span></p><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg070_n0048">Therefore, <math><mrow><mi>m</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>y</mi><mo>−</mo><mi>c</mi></mrow><mi>x</mi></mfrac></mstyle></mrow></math>, provided <math><mrow><mi>x</mi><mo>≠</mo><mn>0</mn></mrow></math>.</span></p></div></div></section></div>
