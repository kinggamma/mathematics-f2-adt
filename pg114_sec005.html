<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container mx-auto opacity-0"><section data-section-type="boxed_text" data-section-id="pg114_sec005" class="mx-auto w-full max-w-4xl px-8 py-8 max-sm:px-5" role="region"><div class="space-y-0 overflow-hidden rounded-[2rem] border border-teal-200 bg-[#cfeeed] shadow-sm"><div class="bg-gradient-to-r from-[#3aa7a7] via-[#7fcfcd] to-[#bcefeb] px-6 py-5 max-sm:px-4"><h1 class="adt-h4 font-bold text-white"><span data-id="pg114_n0043">Example 5.33</span></h1></div><div class="space-y-6 px-6 py-5 max-sm:px-4"><div class="space-y-4"><p class="adt-body text-stone-800"><span data-id="pg114_n0045">Express the following radicals in their most simplified form:</span></p><div class="grid grid-cols-2 gap-x-10 gap-y-4 max-sm:grid-cols-1"><div class="text-stone-900 leading-relaxed [font-family:serif] rounded-xl bg-white/55 px-3 py-2"><div data-id="pg114_n0048"><math><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mtext> </mtext><msqrt><mn>75</mn></msqrt><mo>÷</mo><msqrt><mn>12</mn></msqrt></mrow></math></div></div><div class="text-stone-900 leading-relaxed [font-family:serif] rounded-xl bg-white/55 px-3 py-2"><div data-id="pg114_n0050"><math><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mtext> </mtext><mn>5</mn><msqrt><mfrac><mn>18</mn><mn>50</mn></mfrac></msqrt></mrow></math></div></div><div class="text-stone-900 leading-relaxed [font-family:serif] rounded-xl bg-white/55 px-3 py-2 col-span-2 max-sm:col-span-1"><div data-id="pg114_n0052"><math><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>c</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mtext> </mtext><mfrac><mrow><mn>6</mn><msqrt><mn>5</mn></msqrt><mo>×</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><msqrt><mn>20</mn></msqrt><mo>×</mo><mn>3</mn><msqrt><mn>12</mn></msqrt></mrow></mfrac></mrow></math></div></div></div></div><div class="space-y-4"><h3 class="adt-h3 font-bold text-teal-700"><span data-id="pg114_n0054">Solution</span></h3><div class="space-y-2 text-stone-900 [font-family:serif] leading-relaxed"><div class="pl-0"><div data-id="pg114_n0056"><math><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mtext> </mtext><msqrt><mn>75</mn></msqrt><mo>÷</mo><msqrt><mn>12</mn></msqrt><mo>=</mo><mfrac><msqrt><mn>75</mn></msqrt><msqrt><mn>12</mn></msqrt></mfrac></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0057"><math><mrow><mo>=</mo><msqrt><mfrac><mn>75</mn><mn>12</mn></mfrac></msqrt></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0058"><math><mrow><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mo>×</mo><mn>25</mn></mrow><mrow><mn>3</mn><mo>×</mo><mn>4</mn></mrow></mfrac></msqrt></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0059"><math><mrow><mo>=</mo><msqrt><mfrac><mn>25</mn><mn>4</mn></mfrac></msqrt></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0060"><math><mrow><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac></mrow></math></div></div><div class="pt-2"><div data-id="pg114_n0061"><math><mtext>Therefore, </mtext></math> <math><msqrt><mn>75</mn></msqrt></math> <math><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">÷</mo></math> <math><msqrt><mn>12</mn></msqrt></math> = <math><mfrac><mn>5</mn><mn>2</mn></mfrac></math>.</div></div></div><div class="space-y-2 pt-2 text-stone-900 [font-family:serif] leading-relaxed"><div class="pl-0"><div data-id="pg114_n0063"><math><mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mtext> </mtext><mn>5</mn><msqrt><mfrac><mn>18</mn><mn>50</mn></mfrac></msqrt><mo>=</mo><mn>5</mn><mo>×</mo><msqrt><mfrac><mn>18</mn><mn>50</mn></mfrac></msqrt></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0064"><math><mrow><mo>=</mo><mn>5</mn><mo>×</mo><mfrac><msqrt><mn>18</mn></msqrt><msqrt><mn>50</mn></msqrt></mfrac></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0065"><math><mrow><mo>=</mo><mn>5</mn><mo>×</mo><mfrac><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><mn>5</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0066"><math><mrow><mo>=</mo><mn>5</mn><mo>×</mo><mfrac><mrow><mn>3</mn><mo>×</mo><msqrt><mn>2</mn></msqrt></mrow><mrow><mn>5</mn><mo>×</mo><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></math></div></div><div class="pl-8 max-sm:pl-5"><div data-id="pg114_n0067">= 3</div></div><div class="pt-2"><div data-id="pg114_n0068"><math><mtext>Therefore, </mtext></math> <math><mrow><mn>5</mn><msqrt><mfrac><mn>18</mn><mn>50</mn></mfrac></msqrt></mrow></math> = 3.</div></div></div></div></div></div></section></div>
