    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg184_split02" class="mx-auto w-full max-w-4xl px-8 py-8 max-sm:px-5"><div class="overflow-hidden rounded-[1.25rem] border border-teal-200 bg-[#dff1f1] shadow-sm"><div class="bg-gradient-to-r from-teal-700 to-cyan-500 px-6 py-4 max-sm:px-5"><h1 class="adt-h3 font-bold text-white" data-id="pg185_n0072">Example 8.15</h1></div><div class="px-6 py-6 text-stone-800 max-sm:px-5"><p class="adt-body leading-relaxed"><span data-id="pg185_n0074">Given that sin &#x3b8; = 4/9, find cos &#x3b8; and tan &#x3b8; for 0&#xb0; &#x2264; &#x3b8; &#x2264; 90&#xb0;.</span></p><h3 class="adt-h3 mt-5 font-bold text-teal-700" data-id="pg185_n0076">Solution</h3><p class="adt-body mt-4 leading-relaxed"><span data-id="pg185_n0078">Given sin &#x3b8; = 4/9.</span> <span data-id="pg185_n0079">From</span></p><p class="adt-body mt-2 text-center leading-relaxed text-lg"><span data-id="pg185_n0080" class="italic block"><math><mrow><msup><mi>sin</mi><mn>2</mn></msup><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>θ</mi><mo>+</mo><msup><mi>cos</mi><mn>2</mn></msup><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>θ</mi><mo>=</mo><mn>1</mn></mrow></math></span><span data-id="pg185_n0081" class="sr-only">,</span><span data-id="pg185_n0082" class="italic block mt-1"><math><mrow><msup><mi>cos</mi><mn>2</mn></msup><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>θ</mi><mo>=</mo><mn>1</mn><mo>−</mo><msup><mi>sin</mi><mn>2</mn></msup><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>θ</mi></mrow></math></span><span data-id="pg185_n0083" class="sr-only">.</span></p><p class="adt-body mt-4 leading-relaxed"><span data-id="pg185_n0085">But,</span></p><p class="adt-body mt-2 text-center leading-relaxed text-lg"><span data-id="pg185_n0086" class="italic block"><math><mrow><msup><mi>sin</mi><mn>2</mn></msup><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>θ</mi><mo>=</mo><mfrac><mn>16</mn><mn>81</mn></mfrac></mrow></math></span><span data-id="pg185_n0087" class="sr-only">.</span></p><p class="adt-body mt-4 text-center leading-relaxed text-lg"><span data-id="pg185_n0089" class="italic block"><math><mrow><msup><mi>cos</mi><mn>2</mn></msup><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>θ</mi><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mn>16</mn><mn>81</mn></mfrac><mo>=</mo><mfrac><mn>65</mn><mn>81</mn></mfrac></mrow></math></span></p><p class="adt-body mt-4 leading-relaxed"><span data-id="pg185_n0091">Hence,</span></p><p class="adt-body mt-2 text-center leading-relaxed text-lg"><span data-id="pg185_n0092" class="italic block"><math><mrow><mrow><mi>cos</mi><mo>⁡</mo><mspace width="0.1667em"></mspace></mrow><mi>θ</mi><mo>=</mo><mo form="prefix" stretchy="false">±</mo><msqrt><mfrac><mn>65</mn><mn>81</mn></mfrac></msqrt><mo>=</mo><mo form="prefix" stretchy="false">±</mo><mfrac><msqrt><mn>65</mn></msqrt><mn>9</mn></mfrac></mrow></math></span><span data-id="pg185_n0093" class="sr-only">.</span></p></div></div><div class="mt-8 flex items-center justify-between gap-4 border-t border-stone-200 pt-4 text-stone-500 max-sm:flex-col max-sm:items-start"><p class="adt-caption opacity-80" data-id="pg185_n0096">MATHEMATIC F2 v5.indd 178</p><p class="adt-caption opacity-80" data-id="pg185_n0097">05/04/2026 13:06:46</p></div></section></div>
