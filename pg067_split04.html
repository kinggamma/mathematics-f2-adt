    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg067_split04" class="mx-auto w-full max-w-5xl px-8 max-sm:px-5"><div class="rounded-3xl border-4 border-cyan-200 bg-gradient-to-br from-cyan-50 via-white to-amber-50 p-8 shadow-lg space-y-6"><div class="inline-block rounded-2xl bg-orange-100 px-4 py-2 shadow-sm"><h1 class="adt-h3 font-bold text-orange-700" data-id="pg068_n0052">Example 4.4</h1></div><p class="adt-body text-stone-800 leading-relaxed text-lg"><span data-id="pg068_n0054">Given that <math><mrow><mi>p</mi><mo>∗</mo><mi>q</mi><mo>=</mo><msup><mi>p</mi><mn class="tml-med-pad">2</mn></msup><mo>−</mo><msup><mi>q</mi><mn class="tml-med-pad">2</mn></msup></mrow></math>, find the value of <math><mrow><mn>7</mn><mo>∗</mo><mn>3</mn></mrow></math>.</span></p><div class="rounded-2xl bg-cyan-100 px-4 py-3"><h4 class="adt-h4 font-semibold text-cyan-900" data-id="pg068_n0056">Solution</h4></div><div class="rounded-2xl bg-white/90 p-5 ring-1 ring-cyan-100 space-y-3"><p class="adt-body text-stone-800 leading-relaxed text-lg"><span data-id="pg068_n0058">From <math><mrow><mi>p</mi><mo>∗</mo><mi>q</mi><mo>=</mo><msup><mi>p</mi><mn class="tml-med-pad">2</mn></msup><mo>−</mo><msup><mi>q</mi><mn class="tml-med-pad">2</mn></msup></mrow></math>, it follows that,</span></p><div class="overflow-x-auto adt-body text-stone-900" data-id="pg068_n0059">7 * 3 = 7^2 - 3^2</div><div class="overflow-x-auto adt-body text-stone-900" data-id="pg068_n0060">= 49 - 9</div><div class="overflow-x-auto adt-body text-stone-900" data-id="pg068_n0061">= 40</div><p class="adt-body text-stone-800 leading-relaxed text-lg"><span data-id="pg068_n0062">Therefore, <math><mrow><mn>7</mn><mo>∗</mo><mn>3</mn><mo>=</mo><mn>40</mn></mrow></math>.</span></p></div></div></section></div>
