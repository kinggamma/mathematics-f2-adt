<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg067_split02" class="mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-5"><div class="rounded-[1.75rem] border-2 border-teal-300 bg-gradient-to-br from-cyan-50 via-white to-emerald-50 p-8 shadow-[0_12px_30px_rgba(0,0,0,0.08)] max-sm:p-5"><div class="border-l-8 border-teal-500 pl-5 max-sm:pl-4"><h1 class="adt-h3 font-bold text-teal-800" data-id="pg068_n0021">Example 4.2</h1><p class="adt-body mt-4 italic leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0023">If <math><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mi>b</mi></mrow></math>, find the value of <math><mi>y</mi></math> given that <math><mrow><mn>4</mn><mo>∗</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>2</mn><mo>∗</mo><mi>y</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>=</mo><mn>4</mn></mrow></math>.</span></p><h4 class="adt-h4 mt-6 font-semibold text-orange-700" data-id="pg068_n0025">Solution</h4><p class="adt-body mt-4 leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0027">Given <math><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mi>b</mi></mrow></math>.</span> <span data-id="pg068_n0028">Start with the operation in the brackets.</span></p><div class="mt-4 space-y-4 pl-1"><div class="adt-body font-medium text-stone-900" data-id="pg068_n0029">4 *(2 * y) = 4 *(2^2 - y)</div><div class="adt-body font-medium text-stone-900" data-id="pg068_n0030">= 4 *(4 - y)</div><div class="adt-body font-medium text-stone-900" data-id="pg068_n0031">= 4^2 - (4 - y)</div><div class="adt-body font-medium text-stone-900" data-id="pg068_n0032">= 16 - 4 + y</div><div class="adt-body font-medium text-stone-900" data-id="pg068_n0033">= 12 + y</div></div><p class="adt-body mt-4 leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0034">Thus, <math><mrow><mn>12</mn><mo>+</mo><mi>y</mi><mo>=</mo><mn>4</mn></mrow></math></span></p><div class="adt-body mt-4 font-medium text-stone-900" data-id="pg068_n0035">y = -8</div><p class="adt-body mt-4 leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0036">Therefore, <math><mrow><mi>y</mi><mo>=</mo><mo form="prefix" stretchy="false">−</mo><mn>8</mn></mrow></math>.</span></p></div></div></section></div>
