    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg067_split01" class="mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-5"><div class="space-y-5 rounded-[2rem] border-4 border-teal-300 bg-gradient-to-br from-cyan-50 via-white to-amber-50 p-7 shadow-lg max-sm:p-6"><h1 class="adt-h3 font-bold text-teal-800" data-id="pg068_n0008">Example 4.1</h1><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0010">If <math><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><mn>5</mn><mi>a</mi><mo>−</mo><mi>b</mi></mrow></math>, find the value of <math><mrow><mn>6</mn><mo>∗</mo><mn>9</mn></mrow></math>.</span></p><h4 class="adt-h4 font-semibold text-orange-700" data-id="pg068_n0012">Solution</h4><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0014">From <math><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><mn>5</mn><mi>a</mi><mo>−</mo><mi>b</mi></mrow></math>, it implies that,</span></p><div class="rounded-2xl border border-stone-200 bg-white/90 px-5 py-4 shadow-sm"><div class="adt-body overflow-x-auto leading-relaxed text-stone-900 text-lg" data-id="pg068_n0015"><math><mrow><mn>6</mn><mo>∗</mo><mn>9</mn><mo>=</mo><mn>5</mn><mo>×</mo><mn>6</mn><mo>−</mo><mn>9</mn></mrow></math></div></div><div class="rounded-2xl border border-stone-200 bg-white/90 px-5 py-4 shadow-sm"><div class="adt-body overflow-x-auto leading-relaxed text-stone-900" data-id="pg068_n0016">= 30 - 9</div></div><div class="rounded-2xl border border-stone-200 bg-white/90 px-5 py-4 shadow-sm"><div class="adt-body overflow-x-auto leading-relaxed text-stone-900" data-id="pg068_n0017">= 21</div></div><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0018">Therefore, <math><mrow><mn>6</mn><mo>∗</mo><mn>9</mn><mo>=</mo><mn>21</mn></mrow></math>.</span></p></div></section></div>
