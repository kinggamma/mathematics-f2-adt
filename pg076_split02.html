  <section data-section-type="boxed_text" data-section-id="pg076_split02" class="mx-auto w-full px-8 py-8 max-lg:px-6 max-sm:px-4">
    <div class="overflow-hidden rounded-2xl border border-cyan-200 bg-[#d9f0f4] shadow-md">

        <h1 class="adt-h3 text-left font-bold text-white" data-id="pg077_n0016">Example 4.20</h1>
      </div>
      <div class="space-y-5 px-6 py-6 text-left text-stone-800 max-sm:px-4 max-sm:py-5">
        <p class="adt-body leading-relaxed text-lg"><span data-id="pg077_n0017">Factorize <math><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mn>25</mn><msup><mi>b</mi><mn>2</mn></msup></mrow></math>.</span></p>
        <h4 class="adt-h4 text-left font-bold text-teal-700" data-id="pg077_n0019">Solution</h4>
        <p class="adt-body leading-relaxed text-lg"><span data-id="pg077_n0021">Write <math><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mn>25</mn><msup><mi>b</mi><mn>2</mn></msup></mrow></math> as a difference of two squares.</span></p>
        <div class="space-y-3 pl-0 text-stone-900 max-sm:space-y-2">
          <p class="adt-body leading-relaxed italic" data-id="pg077_n0022"><math><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mn>25</mn><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><msup><mn>5</mn><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup></mrow></math></p>
          <p class="adt-body leading-relaxed italic" data-id="pg077_n0023"><math><mrow><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>5</mn><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mn>2</mn></msup></mrow></math></p>
          <p class="adt-body leading-relaxed italic" data-id="pg077_n0024">= (a - 5b)(a + 5b)</p>
        </div>
        <p class="adt-body leading-relaxed text-lg"><span data-id="pg077_n0026">Therefore, <math><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mn>25</mn><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo>−</mo><mn>5</mn><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo>+</mo><mn>5</mn><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></math>.</span></p>
      </div>
    </div>
