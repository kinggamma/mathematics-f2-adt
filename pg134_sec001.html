      <div id="content" class="mx-auto w-full max-w-5xl bg-white px-10 py-12 text-stone-800 max-lg:px-8 max-sm:px-5 max-sm:py-8 opacity-0"><section data-section-type="text_only" data-section-id="pg134_sec001" role="region" class="mx-auto w-full"><div class="max-w-3xl border-l-4 border-teal-300/70 bg-gradient-to-br from-white via-white to-cyan-50/40 pl-6 pr-8 py-4 shadow-sm max-lg:pr-6 max-sm:border-l-2 max-sm:pl-4 max-sm:pr-2 max-sm:py-3"><div class="space-y-4"><h1 class="adt-h3 text-left font-semibold italic text-stone-800" data-id="pg134_n0003">Roots law</h1><p class="adt-body text-left leading-8"><span data-id="pg134_n0005">The law states that</span></p><p class="adt-body text-left leading-8 pl-8 max-sm:pl-4 text-lg"><span data-id="pg134_n0006"><math><mrow><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><mroot><msup><mi>x</mi><mi class="tml-sml-pad">n</mi></msup><mi>m</mi></mroot><mo>=</mo><mfrac><mi>n</mi><mi>m</mi></mfrac><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>x</mi></mrow></math></span></p><p class="adt-body text-left leading-8"><span data-id="pg134_n0008">It is proved as follows.</span></p><div class="space-y-2 pt-1"><p class="adt-body text-left leading-8 text-lg"><span data-id="pg134_n0010">Let</span> <span data-id="pg134_n0011"><math><mrow><mi>p</mi><mo>=</mo><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><mroot><msup><mi>x</mi><mi class="tml-sml-pad">n</mi></msup><mi>m</mi></mroot></mrow></math></span></p><p class="adt-body text-left leading-8"><span data-id="pg134_n0012">From the law of exponents,</span></p><p class="adt-body text-left leading-8 pl-10 max-sm:pl-5 text-lg"><span data-id="pg134_n0013"><math><mrow><mroot><msup><mi>x</mi><mi class="tml-sml-pad">n</mi></msup><mi>m</mi></mroot><mo>=</mo><msup><mi>x</mi><mfrac class="tml-sml-pad"><mi scriptlevel="2" style="math-depth:2;">n</mi><mi scriptlevel="2" style="math-depth:2;">m</mi></mfrac></msup></mrow></math></span></p></div><div class="space-y-2 pt-1"><p class="adt-body text-left leading-8"><span data-id="pg134_n0015">It follows that</span></p><p class="adt-body text-left leading-8 pl-10 max-sm:pl-5 text-lg"><span data-id="pg134_n0016"><math><mrow><mi>p</mi><mo>=</mo><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><msup><mi>x</mi><mfrac class="tml-sml-pad"><mi scriptlevel="2" style="math-depth:2;">n</mi><mi scriptlevel="2" style="math-depth:2;">m</mi></mfrac></msup></mrow></math></span></p><p class="adt-body text-left leading-8 pl-14 max-sm:pl-7 text-lg"><span data-id="pg134_n0017"><math><mrow><mo>=</mo><mfrac><mi>n</mi><mi>m</mi></mfrac><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>x</mi></mrow></math></span></p></div><div class="space-y-2 pt-2"><p class="adt-body text-left leading-8"><span data-id="pg134_n0019">Therefore,</span></p><p class="adt-body text-left leading-8 pl-10 max-sm:pl-5 text-lg"><span data-id="pg134_n0020"><math><mrow><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><mroot><msup><mi>x</mi><mi class="tml-sml-pad">n</mi></msup><mi>m</mi></mroot><mo>=</mo><mfrac><mi>n</mi><mi>m</mi></mfrac><msub><mi>log</mi><mi>a</mi></msub><mo>⁡</mo><mspace width="0.1667em"></mspace><mi>x</mi></mrow></math></span></p></div></div></div></section></div>
