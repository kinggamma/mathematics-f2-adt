      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg076_split04" class="mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-4"><div class="overflow-hidden bg-cyan-50/80 shadow-sm ring-1 ring-cyan-100"><div class="bg-gradient-to-r from-teal-700 via-teal-500 to-cyan-300 px-6 py-3 max-sm:px-4"><h1 class="adt-h3 font-bold text-white" data-id="pg077_n0042">Example 4.22</h1></div><div class="space-y-5 px-6 py-5 max-sm:px-4"><div class="adt-body text-stone-900 text-lg" data-id="pg077_n0043">Find the exact value of <math><mrow><msup><mn>50001</mn><mn>2</mn></msup><mo>−</mo><msup><mn>49999</mn><mn>2</mn></msup></mrow></math></div><h4 class="adt-h4 font-semibold text-teal-700" data-id="pg077_n0045">Solution</h4><div class="space-y-3 border-l-2 border-rose-200 pl-5 max-sm:pl-4"><div class="adt-body text-stone-900" data-id="pg077_n0046">50001^2 - 49999^2</div><div class="adt-body text-stone-900" data-id="pg077_n0047">= (50001 + 49999)(50001 - 49999)</div><div class="adt-body text-stone-900 text-lg" data-id="pg077_n0048"><math><mrow><mo>=</mo><mn>100000</mn><mo>×</mo><mn>2</mn></mrow></math></div><div class="adt-body text-stone-900" data-id="pg077_n0049">= 200000</div></div><p class="adt-body pt-2 text-stone-900 text-lg"><span data-id="pg077_n0051">Therefore, <math><mrow><msup><mn>50001</mn><mn>2</mn></msup><mo>−</mo><msup><mn>49999</mn><mn>2</mn></msup><mo>=</mo><mn>200000</mn></mrow></math>.</span></p></div></div></section></div>
