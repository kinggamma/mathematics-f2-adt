    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="text_only" data-section-id="pg076_split05" class="mx-auto w-full max-w-4xl px-8 max-lg:px-6 max-sm:px-4 py-10"><div class="border border-cyan-100 bg-cyan-50 px-6 py-5 shadow-sm max-sm:px-5 max-sm:py-5" style="border-radius:1.5rem;"><h1 class="adt-h3 text-teal-900" data-id="pg077_n0053">Factorization of perfect squares</h1><div class="adt-body mt-4 space-y-3 leading-8 text-stone-800 text-lg"><p><span data-id="pg077_n0055">A quadratic expression whose factor are identical is called a perfect square.</span></p><p><span data-id="pg077_n0056">Consider <math><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>a</mi><mi>b</mi><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mn>2</mn></msup></mrow></math> and <math><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>a</mi><mi>b</mi><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo>−</mo><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mn>2</mn></msup></mrow></math>.</span></p><p><span data-id="pg077_n0057">The two quadratic identities, <math><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mn>2</mn></msup></math> and <math><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mi>a</mi><mo>−</mo><mi>b</mi><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mn>2</mn></msup></math> are called perfect squares.</span></p></div></div></section></div>
