    <div class="overflow-hidden rounded-xl border border-teal-200 bg-cyan-50 shadow-sm">

        <h1 class="adt-h4 font-bold text-white" data-id="pg108_n0044">Example 5.26</h1>
      </div>
      <div class="space-y-5 px-5 py-5 text-stone-800 max-sm:px-4 max-sm:py-4">
        <p class="adt-body leading-relaxed"><span data-id="pg108_n0046">Find the cube root of 216.</span></p>
        <h3 class="adt-h3 font-bold text-teal-700" data-id="pg108_n0047">Solution</h3>
        <div class="space-y-2">
          <p class="adt-body leading-relaxed"><span data-id="pg108_n0049">Write 216 as a product of prime factors:</span></p>
          <div class="adt-body mt-1 break-words leading-relaxed text-stone-900 whitespace-normal text-lg" data-id="pg108_n0050"><math><mrow><mn>216</mn><mo>=</mo><mn>2</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>×</mo><mn>3</mn><mo>×</mo><mn>3</mn><mo>=</mo><msup><mn>2</mn><mn>3</mn></msup><mo>×</mo><msup><mn>3</mn><mn>3</mn></msup></mrow></math></div>
        </div>
        <div class="space-y-2">
          <p class="adt-body leading-relaxed"><span data-id="pg108_n0052">Apply the cube root on both sides, to obtain</span></p>
          <div class="adt-body mt-1 break-words leading-relaxed text-stone-900 whitespace-normal text-lg" data-id="pg108_n0053"><math><mrow><mroot><mn>216</mn><mn>3</mn></mroot><mo>=</mo><mroot><mrow><msup><mn>2</mn><mn>3</mn></msup><mo>×</mo><msup><mn>3</mn><mn>3</mn></msup></mrow><mn>3</mn></mroot><mo>=</mo><mroot><msup><mn>2</mn><mn>3</mn></msup><mn>3</mn></mroot><mo>×</mo><mroot><msup><mn>3</mn><mn>3</mn></msup><mn>3</mn></mroot><mo>=</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msup><mn>2</mn><mn>3</mn></msup><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mfrac><mn scriptlevel="2" style="math-depth:2;">1</mn><mn scriptlevel="2" style="math-depth:2;">3</mn></mfrac></msup><mo>×</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msup><mn>3</mn><mn>3</mn></msup><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mfrac><mn scriptlevel="2" style="math-depth:2;">1</mn><mn scriptlevel="2" style="math-depth:2;">3</mn></mfrac></msup><mo>=</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>=</mo><mn>6</mn></mrow></math></div>
        </div>
        <p class="adt-body leading-relaxed"><span data-id="pg108_n0055">Therefore, the cube root of 216 is 6.</span></p>
