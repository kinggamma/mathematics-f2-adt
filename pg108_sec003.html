<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg108_sec003" class="mx-auto w-full max-w-3xl px-8 max-lg:px-6 max-sm:px-4"><div class="overflow-hidden rounded-xl border border-teal-200 bg-[#d7ebed] shadow-sm"><div class="bg-gradient-to-r from-teal-700 to-teal-300 px-6 py-4 max-sm:px-5"><h1 class="adt-h4 font-bold text-white" data-id="pg108_n0028">Example 5.25</h1></div><div class="px-6 py-5 text-stone-800 max-sm:px-5"><p class="adt-body mb-5"><span data-id="pg108_n0030">Find the square root of 196.</span></p><h3 class="adt-h3 mb-2 font-bold text-teal-700" data-id="pg108_n0031">Solution</h3><p class="adt-body mb-2"><span data-id="pg108_n0033">Write 196 as a product of prime factors:</span></p><div class="mb-4 rounded-lg bg-white/70 px-4 py-3 shadow-sm"><div class="overflow-x-auto text-center leading-relaxed max-sm:text-left" data-id="pg108_n0034"><math><mrow><mn>196</mn><mo>=</mo><mn>2</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>7</mn><mo>×</mo><mn>7</mn><mo>=</mo><msup><mn>2</mn><mn>2</mn></msup><mo>×</mo><msup><mn>7</mn><mn>2</mn></msup></mrow></math></div></div><p class="adt-body mb-4 leading-relaxed text-lg"><span data-id="pg108_n0036"><math><mrow><mtext>So, </mtext><msqrt><mn>196</mn></msqrt></mrow></math>=<math><msqrt><mrow><msup><mn>2</mn><mn>2</mn></msup><mo>×</mo><msup><mn>7</mn><mn>2</mn></msup></mrow></msqrt></math></span></p><p class="adt-body mb-2"><span data-id="pg108_n0038">Apply the radical sign in both sides of the equation and simplify to obtain,</span></p><div class="mb-4 rounded-lg bg-white px-4 py-3 shadow-sm"><div class="overflow-x-auto leading-relaxed" data-id="pg108_n0039"><math><mrow><msqrt><mn>196</mn></msqrt><mo>=</mo><msqrt><mrow><msup><mn>2</mn><mn>2</mn></msup><mo>×</mo><msup><mn>7</mn><mn>2</mn></msup></mrow></msqrt><mo>=</mo><msqrt><msup><mn>2</mn><mn>2</mn></msup></msqrt><mo>×</mo><msqrt><msup><mn>7</mn><mn>2</mn></msup></msqrt><mo>=</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msup><mn>2</mn><mn>2</mn></msup><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mfrac><mn scriptlevel="2" style="math-depth:2;">1</mn><mn scriptlevel="2" style="math-depth:2;">2</mn></mfrac></msup><mo>×</mo><msup><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><msup><mn>7</mn><mn>2</mn></msup><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mfrac><mn scriptlevel="2" style="math-depth:2;">1</mn><mn scriptlevel="2" style="math-depth:2;">2</mn></mfrac></msup><mo>=</mo><mn>2</mn><mo>×</mo><mn>7</mn><mo>=</mo><mn>14</mn></mrow></math></div></div><p class="adt-body leading-relaxed text-lg"><span data-id="pg108_n0041">Therefore, <math><mrow><msqrt><mn>196</mn></msqrt><mo>=</mo><mn>14</mn></mrow></math>.</span></p></div></div></section></div>
