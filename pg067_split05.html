    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg067_split05" class="mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-5"><div class="space-y-5 rounded-[2rem] border-4 border-teal-300 bg-gradient-to-br from-teal-50 via-cyan-50 to-white p-6 shadow-lg"><h1 class="adt-h3 font-bold text-teal-800" data-id="pg068_n0065">Example 4.5</h1><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0067">If <math><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><mn>3</mn><mi>a</mi><mo>+</mo><mi>b</mi></mrow></math>, find the value of <math><mrow><mn>5</mn><mo>∗</mo><mn>8</mn></mrow></math>.</span></p><h4 class="adt-h4 font-bold text-orange-700" data-id="pg068_n0069">Solution</h4><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0071">Given <math><mrow><mi>a</mi><mo>∗</mo><mi>b</mi><mo>=</mo><mn>3</mn><mi>a</mi><mo>+</mo><mi>b</mi></mrow></math>. It follows that,</span></p><div class="space-y-2 rounded-2xl bg-white/85 p-4 ring-1 ring-teal-200"><div class="adt-body text-stone-900 text-lg" data-id="pg068_n0072"><math><mrow><mn>5</mn><mo>∗</mo><mn>8</mn><mo>=</mo><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>3</mn><mo>×</mo><mn>5</mn><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>+</mo><mn>8</mn></mrow></math></div><div class="adt-body text-stone-900" data-id="pg068_n0073">= 15 + 8</div><div class="adt-body text-stone-900" data-id="pg068_n0074">= 23</div></div><p class="adt-body leading-relaxed text-stone-800 text-lg"><span data-id="pg068_n0075">Therefore, <math><mrow><mn>5</mn><mo>∗</mo><mn>8</mn><mo>=</mo><mn>23</mn></mrow></math>.</span></p></div></section></div>
